<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>作戰 CRM · 41大叔每日銷售戰報</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8B%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- ============= 頂部導航 ============= -->
<header class="topbar">
  <div class="brand">
    <span class="brand-icon">🔋</span>
    <div>
      <h1>作戰 CRM</h1>
      <p class="brand-sub">41大叔 · 雲端同步版</p>
    </div>
  </div>

  <nav class="nav-tabs" id="navTabs">
    <button class="nav-tab active" data-view="dashboard">📊 戰報</button>
    <button class="nav-tab" data-view="pipeline">🚦 管線</button>
    <button class="nav-tab" data-view="deals">💰 商機</button>
    <button class="nav-tab" data-view="companies">🏢 客戶</button>
    <button class="nav-tab" data-view="contacts">👤 聯絡人</button>
    <button class="nav-tab" data-view="activities">💬 互動</button>
    <button class="nav-tab" data-view="tasks">✅ 任務</button>
    <button class="nav-tab" data-view="metrics">📈 數據</button>
    <button class="nav-tab" data-view="analytics">🧠 分析</button>
  </nav>

  <div class="topbar-right">
    <span class="sync-indicator" id="syncIndicator" title="同步狀態">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncStatus">本機</span>
    </span>
    <button class="btn-sync" id="btnSync" title="跨裝置同步">🔄 同步</button>
  </div>
</header>

<!-- ============= 主內容區 ============= -->
<main class="main" id="mainView">
  <!-- 視圖由 JS 動態渲染 -->
</main>

<!-- ============= 同步 Modal ============= -->
<div class="modal" id="syncModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🔄 跨裝置雲端同步</h2>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div class="modal-body">
      <p class="sync-help">在不同裝置、不同網域、不同 IP 之間同步資料。<b>不需 API key、不用手動輸入代碼。</b></p>

      <div class="sync-tabs">
        <button class="sync-tab active" data-sync-tab="clipboard">📋 剪貼簿一鍵同步</button>
        <button class="sync-tab" data-sync-tab="file">📁 JSON 檔案備份</button>
        <button class="sync-tab" data-sync-tab="link">🔗 連結分享</button>
      </div>

      <div class="sync-panel active" data-sync-panel="clipboard">
        <h3>📋 剪貼簿一鍵同步</h3>
        <p class="muted">把目前所有資料壓縮成同步碼，按一個鈕複製到剪貼簿；到另一台裝置貼上即可同步。</p>
        <div class="sync-row">
          <textarea id="syncCode" placeholder="按「複製同步碼」後這裡會出現一段編碼…" readonly></textarea>
        </div>
        <div class="sync-actions">
          <button class="btn-primary" id="btnCopySync">📋 複製同步碼</button>
          <button class="btn-secondary" id="btnPasteSync">📥 從剪貼簿貼上同步碼</button>
        </div>
        <p class="sync-note" id="syncNote"></p>
      </div>

      <div class="sync-panel" data-sync-panel="file">
        <h3>📁 JSON 檔案備份 / 還原</h3>
        <p class="muted">完整資料備份到 JSON 檔案（可上傳到雲端硬碟 / Email / WeChat 傳送給自己）。</p>
        <div class="sync-actions">
          <button class="btn-primary" id="btnExportJson">⬇️ 匯出 JSON</button>
          <label class="btn-secondary file-label">
            ⬆️ 匯入 JSON
            <input type="file" id="fileImportJson" accept=".json" hidden>
          </label>
        </div>
        <p class="sync-note" id="fileNote"></p>
      </div>

      <div class="sync-panel" data-sync-panel="link">
        <h3>🔗 微型連結分享（單筆商機）</h3>
        <p class="muted">把任一筆商機打包成網址，傳給同事直接打開就能查看完整資訊。</p>
        <div class="sync-row">
          <input type="text" id="shareLink" readonly placeholder="選擇一筆商機後產生連結…">
        </div>
        <div class="sync-actions">
          <button class="btn-primary" id="btnGenLink">🔗 產生分享連結</button>
          <button class="btn-secondary" id="btnCopyLink">📋 複製連結</button>
        </div>
        <p class="sync-note" id="linkNote"></p>
      </div>
    </div>
  </div>
</div>

<!-- ============= 通用 Modal（新增/編輯） ============= -->
<div class="modal" id="editModal">
  <div class="modal-content modal-large">
    <div class="modal-header">
      <h2 id="editModalTitle">編輯</h2>
      <button class="modal-close" data-close>&times;</button>
    </div>
    <div class="modal-body" id="editModalBody">
      <!-- 表單由 JS 渲染 -->
    </div>
  </div>
</div>

<!-- ============= 確認 Modal ============= -->
<div class="modal" id="confirmModal">
  <div class="modal-content modal-small">
    <div class="modal-header">
      <h2 id="confirmTitle">確認</h2>
    </div>
    <div class="modal-body">
      <p id="confirmMessage">確定要執行此操作嗎？</p>
      <div class="sync-actions">
        <button class="btn-secondary" id="confirmCancel">取消</button>
        <button class="btn-danger" id="confirmOk">確認執行</button>
      </div>
    </div>
  </div>
</div>

<!-- ============= Toast 提示 ============= -->
<div class="toast-container" id="toastContainer"></div>

<!-- ============= 浮動新增按鈕 ============= -->
<button class="fab" id="fabBtn" title="快速新增">＋</button>

<!-- ============= 浮動快速選單 ============= -->
<div class="fab-menu" id="fabMenu">
  <button data-fab="deal">💰 新增商機</button>
  <button data-fab="company">🏢 新增客戶</button>
  <button data-fab="contact">👤 新增聯絡人</button>
  <button data-fab="activity">💬 記錄互動</button>
  <button data-fab="task">✅ 新增任務</button>
  <button data-fab="metric">📈 填寫今日數據</button>
</div>

<!-- ============= 腳本 ============= -->
<script src="assets/js/store.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/pipeline.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/deals.js"></script>
<script src="assets/js/companies.js"></script>
<script src="assets/js/contacts.js"></script>
<script src="assets/js/activities.js"></script>
<script src="assets/js/tasks.js"></script>
<script src="assets/js/metrics.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
